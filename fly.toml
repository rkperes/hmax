# fly.toml app configuration file generated for hmax on 2026-04-04T11:02:24-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hmax'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  BACKEND_URL = 'http://localhost:8080'
  PORT = '3000'

[processes]
  api = '/app/backend/server'
  web = 'bun run --cwd /app/frontend start'

[[services]]
  protocol = 'tcp'
  internal_port = 3000
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['web']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
